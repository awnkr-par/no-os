name: RM915 build

on:
  push:
    branches: [main]
    paths:
      - "Mobile/NK520-RM915/**"
      - ".github/workflows/rm915-build.yml"
  pull_request:
    paths:
      - "Mobile/NK520-RM915/**"
      - ".github/workflows/rm915-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mobile/NK520-RM915

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build host core tests
        run: |
          cc -Iinclude -std=c11 -Wall -Wextra -Werror -fno-builtin \
            tests/host_core.c \
            src/bootargs.c src/klog.c src/scheduler.c src/irq.c src/memory.c \
            -o /tmp/noos-host-core

      - name: Run host core tests
        run: /tmp/noos-host-core

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mobile/NK520-RM915

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install ARM bare-metal toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi file

      - name: Build noOS RM-915
        run: make -f GNUmakefile

      - name: Verify ELF architecture and entrypoint
        run: |
          arm-none-eabi-readelf -h build/noos.elf
          arm-none-eabi-readelf -h build/noos.elf | grep -q "Machine:.*ARM"
          arm-none-eabi-readelf -h build/noos.elf | grep -qi "Entry point address:.*0x80208000"

      - name: Verify required kernel symbols
        run: |
          arm-none-eabi-nm build/noos.elf | grep -Eq "[[:space:]]_start$"
          arm-none-eabi-nm build/noos.elf | grep -Eq "[[:space:]]exception_handle$"
          arm-none-eabi-nm build/noos.elf | grep -Eq "[[:space:]]pmm_init$"
          arm-none-eabi-nm build/noos.elf | grep -Eq "[[:space:]]pmm_alloc_page$"
          arm-none-eabi-nm build/noos.elf | grep -Eq "[[:space:]]pmm_page_is_permanent$"
          arm-none-eabi-nm build/noos.elf | grep -Eq "[[:space:]]boot_add_reserved_range$"
          arm-none-eabi-nm build/noos.elf | grep -Eq "[[:space:]]kmalloc$"
          arm-none-eabi-nm build/noos.elf | grep -Eq "[[:space:]]selftest_run$"
          arm-none-eabi-nm build/noos.elf | grep -Eq "[[:space:]]bootargs_parse$"
          arm-none-eabi-nm build/noos.elf | grep -Eq "[[:space:]]console_printf$"
          arm-none-eabi-nm build/noos.elf | grep -Eq "[[:space:]]klog_snapshot$"
          arm-none-eabi-nm build/noos.elf | grep -Eq "[[:space:]]scheduler_pick_next$"
          arm-none-eabi-nm build/noos.elf | grep -Eq "[[:space:]]irq_register$"
          arm-none-eabi-nm build/noos.elf | grep -Eq "[[:space:]]irq_dispatch$"
          arm-none-eabi-nm build/noos.elf | grep -Eq "[[:space:]]fdt_parse_boot_info$"
          arm-none-eabi-nm build/noos.elf | grep -Eq "[[:space:]]framebuffer_show_boot_splash$"
          arm-none-eabi-nm build/noos.elf | grep -Eq "[[:space:]]boot_status_set$"
          arm-none-eabi-nm build/noos.elf | grep -Eq "[[:space:]]uartdm_validate_full_init_plan$"
          arm-none-eabi-nm build/noos.elf | grep -Eq "[[:space:]]rm915_timer_validate_plan$"
          arm-none-eabi-nm build/noos.elf | grep -Eq "[[:space:]]mmu_prepare_identity$"
          arm-none-eabi-nm build/noos.elf | grep -Eq "[[:space:]]mmu_validate_identity$"
          arm-none-eabi-nm build/noos.elf | grep -Eq "[[:space:]]mmu_descriptor_is_device$"
          arm-none-eabi-nm build/noos.elf | grep -Eq "[[:space:]]__mmu_l1_start$"
          arm-none-eabi-nm build/noos.elf | grep -Eq "[[:space:]]__mmu_l1_end$"
          arm-none-eabi-nm build/noos.elf | grep -Eq "[[:space:]]__diag_start$"
          arm-none-eabi-nm build/noos.elf | grep -Eq "[[:space:]]__diag_end$"

      - name: Verify fully freestanding ELF
        run: |
          UNDEFINED="$(arm-none-eabi-nm -u build/noos.elf)"
          if [ -n "$UNDEFINED" ]; then
            echo "unexpected undefined symbols:"
            echo "$UNDEFINED"
            exit 1
          fi

      - name: Verify diagnostic and MMU sections
        run: |
          arm-none-eabi-objdump -h build/noos.elf | grep -q ".noos_diag"
          arm-none-eabi-readelf -S build/noos.elf | grep -q ".noos_diag"
          arm-none-eabi-objdump -h build/noos.elf | grep -q ".mmu_tables"
          arm-none-eabi-readelf -S build/noos.elf | grep -q ".mmu_tables"

      - name: Inspect artifacts
        run: |
          arm-none-eabi-size build/noos.elf
          file build/noos.elf build/noos.bin build/noos-boot.img
          test -s build/noos.elf
          test -s build/noos.bin
          test -s build/noos-boot.img
          test -s build/noos.map
          test -s build/noos-manifest.json

      - name: Verify generated boot image
        run: make -f GNUmakefile verify

      - name: Verify diagnostic decoder layout
        run: python3 tools/decode_diag.py --selftest

      - name: Save disassembly
        run: make -f GNUmakefile disasm

      - name: Compile UARTDM handoff variant
        run: |
          make -f GNUmakefile BUILD=build-uart UARTDM_HANDOFF=1
          arm-none-eabi-nm build-uart/noos.elf | grep -Eq "[[:space:]]uartdm_adopt_bootloader$"
          arm-none-eabi-nm build-uart/noos.elf | grep -Eq "[[:space:]]uartdm_putc$"
          test -s build-uart/noos-manifest.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: noos-rm915
          if-no-files-found: error
          path: |
            Mobile/NK520-RM915/build/noos.elf
            Mobile/NK520-RM915/build/noos.bin
            Mobile/NK520-RM915/build/noos-boot.img
            Mobile/NK520-RM915/build/noos.map
            Mobile/NK520-RM915/build/noos.lst
            Mobile/NK520-RM915/build/noos-manifest.json
            Mobile/NK520-RM915/build-uart/noos-boot.img
            Mobile/NK520-RM915/build-uart/noos.elf
            Mobile/NK520-RM915/build-uart/noos-manifest.json
